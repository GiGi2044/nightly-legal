<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nightly</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6; color: #1c1c1e; background: #ffffff;
      margin: 0; padding: 48px 20px; text-align: center;
    }
    main { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 1.8rem; margin: 0 0 8px; }
    p { color: #6b6b70; }
    .links { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
    a { color: #0a84ff; font-size: 1.05rem; text-decoration: none; }
    a:hover { text-decoration: underline; }
    @media (prefers-color-scheme: dark) {
      body { color: #f2f2f7; background: #1c1c1e; }
      p { color: #9a9aa0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Nightly</h1>
    <p>One story, one poem, one essay — every night. A reading ritual app for iOS
       that runs entirely on your device.</p>
    <div class="links">
      <a href="./privacy.html">Privacy Policy</a>
      <a href="./terms.html">Terms of Use</a>
    </div>
  </main>
</body>
</html>
